<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Product Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f3ec;
            font-family: Arial, sans-serif;
            color: #403a34;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: #fffdf9;
            border: 1px solid #e7ded2;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(64, 58, 52, 0.08);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        h1 {
            font-size: 21px;
            margin: 18px 0 5px;
        }

        .design {
            color: #756d63;
            margin: 0 0 8px;
        }

        .price {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #403a34;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="card">

        <img
            src="funzies.jpeg"
            alt="Swarna Dhaaga - Design 2"
        >

        <h1>Swarna Dhaaga</h1>

        <p class="design">Design 2</p>

        <div class="price">₹149</div>

        <button onclick="enquireWhatsApp()">
            Enquire on WhatsApp
        </button>

    </div>

    <script>
        function enquireWhatsApp() {

            const phone = "919836960841";

            const product = "Swarna Dhaaga";
            const design = "Design 2";

            const message =
                `Hi! I'm interested in ${product} — ${design}. ` +
                `Could you please share the price and details?`;

            const url =
                `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

            window.location.href = url;
        }
    </script>

</body>
</html>
